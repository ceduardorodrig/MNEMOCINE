# sops — regras de criptografia (chaves age)
# Decriptar: sops --decrypt <arquivo>   (usa a chave privada em ~/.config/sops/age/keys.txt)
# Editar:    sops <arquivo>             (abre editor + re-encripta)
#
# DOIS recipients age desde 2026-10-13 (plano de recuperação — Rota A):
#   1. psicopompo  age1fgqzpez…  — chave primária (host que cria/re-encripta o store).
#   2. kavure      age1u2c35fk…  — segundo recipient, para o store continuar decriptável
#                                  quando o psicopompo for perdido (o kavure é o host
#                                  sempre-ligado que gerencia o Swarm).
#   Ref. de DR: recovery/psicopompo-loss.md §2 G1 (item HB-064).
#
# NUNCA passe `--age` na linha de comando: isso IGNORA este arquivo e substituiria os
# recipients por um só, derrubando o kavure. Deixe o .sops.yaml dirigir (sops detecta-o
# pelo CWD; rode o re-encrypt de dentro de mnemocine/).
creation_rules:
  - path_regex: \.env$
    encrypted_regex: "^(.*)$"
    age: >-
      age1fgqzpezgrgltznctlvw7xexglhj7kv96hr6n7jz2xaucm4977y8sfn2s8f,
      age1u2c35fk9c65037w6l47lrsehtdeyumfhh64tdf6n45dsld6phchqvw24z3
