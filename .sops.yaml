# sops — encryption rules (age keys)
# Decrypt: sops --decrypt <file>   (uses the private key in ~/.config/sops/age/keys.txt)
# Edit:    sops <file>             (opens editor + re-encrypts)
#
# TWO age recipients since 2026-10-13 (recovery plan — Route A):
#   1. psicopompo  age1fgqzpez…  — primary key (host that creates/re-encrypts the store).
#   2. kavure      age1u2c35fk…  — second recipient, so the store stays decryptable
#                                  when psicopompo is lost (kavure is the always-on
#                                  host that manages the Swarm).
#   DR ref.: recovery/psicopompo-loss.md §2 G1 (item HB-064).
#
# NEVER pass `--age` on the command line: it IGNORES this file and would replace the
# recipients with a single one, locking kavure out. Let .sops.yaml drive (sops detects it
# via the CWD; run the re-encrypt from inside mnemocine/).
creation_rules:
  - path_regex: \.env$
    encrypted_regex: "^(.*)$"
    age: >-
      age1fgqzpezgrgltznctlvw7xexglhj7kv96hr6n7jz2xaucm4977y8sfn2s8f,
      age1u2c35fk9c65037w6l47lrsehtdeyumfhh64tdf6n45dsld6phchqvw24z3
