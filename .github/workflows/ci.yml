name: ci

# Governance audit by StenioSentinel — homelab documentation.
#
# WHY IT CHANGED (2026-09-29): this repository is PUBLIC and had no CI at all.
# An audit revealed a plaintext password in a guide (`Valheim`) — with no real
# security value (access is blocked by the tailnet, not by the password), but it is
# exactly the kind of inconsistency the gate exists to catch: a secret value
# in a public repository must become a reference to the vault.
#
# Consumes the engine's composite action, which downloads the prebuilt binary from the
# release instead of compiling Rust here. See:
#   mnemocine/guides/stenio-ci-unificado.md and guides/ferramentas-de-operacao.md

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Governance Audit (homelab docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: StenioSentinel — auditar documentação do homelab
        uses: ceduardorodrig/STENIO-SENTINEL/.github/actions/stenio-check@v1
        with:
          scope: homelab
          path: .
          github-format: "true"
